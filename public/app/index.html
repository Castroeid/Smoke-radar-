<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Smoke Radar App</title>
  <meta name="theme-color" content="#080b10" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Smoke Radar" />
  <link rel="apple-touch-icon" href="/app/icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" href="/app/icons/icon-192.png" />
  <link rel="manifest" href="/app/manifest.json" />
  <link rel="stylesheet" href="/app/app.css" />
  <link rel="stylesheet" href="/app/recipe-guidance.css" />
</head>
<body>
  <div id="openingSplash" class="opening-splash" aria-hidden="true">
    <div class="opening-splash-overlay"></div>
    <div class="opening-splash-content">
      <div class="opening-logo">
        <span class="brand-mark" aria-hidden="true"><img src="/app/icons/icon-192.png" width="192" height="192" alt="" /></span>
        <span>Smoke Radar</span>
      </div>
      <div class="opening-radar-loader" aria-hidden="true">
        <span></span>
      </div>
      <p id="openingMessage" class="opening-message"></p>
      <ol id="openingSteps" class="opening-steps"></ol>
      <div class="opening-progress" aria-hidden="true">
        <span id="openingProgressFill" class="opening-progress-fill"></span>
      </div>
    </div>
  </div>

  <main id="app" class="app-shell" data-step="landing">
    <header id="appHeader" class="app-header">
      <div class="app-header-top">
        <p class="brand">
          <span class="brand-mark" aria-hidden="true"><img src="/app/icons/icon-192.png" width="192" height="192" alt="" /></span>
          <span>Smoke Radar</span>
        </p>
        <button id="homeBtn" class="home-button" type="button" aria-label="חזרה למסך הבית" hidden>בית</button>
      </div>
      <h1 id="screenTitle"></h1>
      <p id="screenSubtitle" class="hero-subtitle"></p>
    </header>

    <section id="screenContent" class="screen-content"></section>

    <nav class="app-nav">
      <button id="backBtn" class="btn btn-ghost" type="button"></button>
      <button id="nextBtn" class="btn btn-primary" type="button"></button>
    </nav>
  </main>
  <div id="appToast" class="app-toast" role="status" aria-live="polite"></div>

  <script src="/app/pwa.js" defer></script>
  <script src="/app/hot-topics.js" defer></script>
  <script src="/app/recipe-protocols.js" defer></script>
  <script src="/app/recipe-quality.js" defer></script>
  <script src="/app/recipe-guidance.js" defer></script>
  <script src="/app/recipe-fallback.js" defer></script>
  <script src="/app/recipe-store.js" defer></script>
  <script src="/app/butcher-guide.js" defer></script>
  <script src="/app/cut-photo.js" defer></script>
  <script src="/app/app.js" defer></script>
</body>
</html>
